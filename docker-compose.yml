services:
  tiktok-monitor:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_DIR: /app/data
    volumes:
      - tiktok_monitor_data:/app/data
    restart: unless-stopped

volumes:
  tiktok_monitor_data:
