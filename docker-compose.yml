services:
  tiktok-monitor:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_DIR: /app/data
      TRANSCRIBER_URL: http://tiktok-transcriber:5001
    volumes:
      - tiktok_monitor_data:/app/data
    restart: unless-stopped

  tiktok-transcriber:
    build: ./transcriber
    ports:
      - "5001:5001"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_DIR: /app/data
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      TRANSCRIPT_CHUNK_SECONDS: ${TRANSCRIPT_CHUNK_SECONDS:-30}
      TRANSCRIBER_PORT: "5001"
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      DEFAULT_TARGET_LANG: ${DEFAULT_TARGET_LANG:-en}
    volumes:
      - tiktok_transcriber_data:/app/data
      - tiktok_transcriber_hf_cache:/app/hf-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  tiktok_monitor_data:
  tiktok_transcriber_data:
  tiktok_transcriber_hf_cache:
